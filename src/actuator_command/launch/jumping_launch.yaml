launch:

- node:
    pkg: "spi_interface"
    exec: "interpreter_node"
    name: "interpreter"
    remap:
    -
        from: "/actuator_data_out"
        to: "/actuator_telemetry"
    -
        from: "/actuator_command_in"
        to: "/actuator_control"

    -   
        from: "/actuator_command_out"
        to: "/actuator_raw_data_out"
    -
        from: "/actuator_data_in"
        to: "/actuator_raw_data_in"
- node:
    pkg: "actuator_command"
    exec: "jumping_state_machine"
    name: "jumping_state_machine"
    remap:
    -
        from: "/actuator_command"
        to: "/actuator_control"

- node:
    pkg: "actuator_command"
    exec: "error_reader_node"
    name: "error_reader"